<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>About MarkdownRE</title>
<style>
:root { color-scheme: light; --bg: #f6f6f6; --fg: #242424; --muted: #666; }
:root[data-theme="dark"] { color-scheme: dark; --bg: #202124; --fg: #eee; --muted: #bbb; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
main { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 25px 30px; text-align: center; }
.app-icon { width: 80px; height: 80px; object-fit: contain; }
h1 { margin: 14px 0 5px; font-size: 21px; font-weight: 600; }
.version, .detail, .copyright { color: var(--muted); }
.version { margin: 0; }
.detail { margin: 20px 0 24px; max-width: 320px; font-size: 12px; line-height: 1.45; white-space: pre-line; }
.developer-logo { width: 32px; height: 32px; object-fit: contain; }
.copyright { margin: 8px 0 0; font-size: 11px; }
</style>
</head>
<body><main>
<img class="app-icon" src="MarkdownRE.png" alt="">
<h1>MarkdownRE</h1>
<p class="version" id="version"></p>
<p class="detail" id="detail"></p>
<img class="developer-logo" src="RayStudioLabs-mark.svg" alt="">
<p class="copyright">© 2026 RayStudioLabs</p>
</main><script src="about.js"></script></body>
</html>
